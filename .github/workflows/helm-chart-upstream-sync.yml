name: Sync Upstream PGO Helm Chart

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  sync-upstream:
    name: Pull upstream PGO chart and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      # Step 3: Pull the upstream OCI chart and resolve its version
      - name: Pull upstream PGO chart via OCI
        id: helm_pull
        run: |
          mkdir -p /tmp/upstream
          helm pull oci://registry.developers.crunchydata.com/crunchydata/pgo \
            --untar \
            --untardir /tmp/upstream
          CHART_VERSION=$(yq '.version' /tmp/upstream/pgo/Chart.yaml)
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Pulled upstream PGO chart version: ${CHART_VERSION}" 

      # Step 4: Check whether a branch for this version already exists
      - name: Check for existing sync branch
        id: check_branch
        run: |
          BRANCH="upstream-pgo-sync-${{ steps.helm_pull.outputs.chart_version }}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Branch ${BRANCH} already exists – skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Step 5: Copy the pulled chart into helm/install and detect changes
      - name: Copy upstream chart into helm/install
        if: steps.check_branch.outputs.exists == 'false'
        id: copy_chart
        run: |
          cp -r /tmp/upstream/pgo/. ./helm/install/
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected – upstream matches current helm/install."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Step 6: Commit and push to a new branch
      - name: Commit and push sync branch
        if: >-
          steps.check_branch.outputs.exists == 'false' &&
          steps.copy_chart.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.check_branch.outputs.branch }}"
          git add helm/install/
          git commit -m "chore: sync upstream PGO helm chart v${{ steps.helm_pull.outputs.chart_version }}"
          git push origin "${{ steps.check_branch.outputs.branch }}"

      # Step 7: Open a Pull Request for review
      - name: Create Pull Request
        if: >-
          steps.check_branch.outputs.exists == 'false' &&
          steps.copy_chart.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: sync upstream PGO helm chart v${{ steps.helm_pull.outputs.chart_version }}" \
            --body "## Upstream PGO Helm Chart Sync

          This PR was automatically generated by the **Sync Upstream PGO Helm Chart** workflow.

          **Upstream version:** \`${{ steps.helm_pull.outputs.chart_version }}\`
          **Source:** \`oci://registry.developers.crunchydata.com/crunchydata/pgo\`

          ### What to review
          - Compare changes in \`helm/install/\` against your custom configuration
          - Keep your custom values/templates where they differ intentionally
          - Merge what you want to adopt from the upstream release

          > Triggered by: ${{ github.event_name }}" \
            --base main \
            --head "${{ steps.check_branch.outputs.branch }}"
