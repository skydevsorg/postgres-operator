name: Sync Upstream postgres-operator-examples

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  sync-upstream:
    name: Pull upstream examples and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Step 1: Checkout this repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Clone the upstream repository (main branch, sparse – only the paths we care about)
      - name: Clone upstream postgres-operator-examples (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/CrunchyData/postgres-operator-examples.git \
            /tmp/upstream-examples
          cd /tmp/upstream-examples
          git sparse-checkout set helm/postgres LICENSE.md README.md

      # Step 3: Resolve the upstream commit SHA (used as the branch suffix)
      - name: Resolve upstream commit SHA
        id: upstream_meta
        run: |
          SHA=$(git -C /tmp/upstream-examples rev-parse --short HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "Upstream commit: ${SHA}"

      # Step 4: Check whether a sync branch for this SHA already exists
      - name: Check for existing sync branch
        id: check_branch
        run: |
          BRANCH="upstream-examples-sync-${{ steps.upstream_meta.outputs.sha }}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Branch ${BRANCH} already exists – skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Step 5: Copy tracked paths from upstream and detect changes
      - name: Copy upstream files into repository
        if: steps.check_branch.outputs.exists == 'false'
        id: copy_files
        run: |
          cp -r /tmp/upstream-examples/helm/postgres/. ./helm/postgres/
          cp /tmp/upstream-examples/LICENSE.md ./LICENSE.md
          cp /tmp/upstream-examples/README.md  ./README.md
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected – repository is already up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat
          fi

      # Step 6: Commit and push to a new branch
      - name: Commit and push sync branch
        if: >-
          steps.check_branch.outputs.exists == 'false' &&
          steps.copy_files.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.check_branch.outputs.branch }}"
          git add helm/postgres/ LICENSE.md README.md
          git commit -m "chore: sync upstream postgres-operator-examples @ ${{ steps.upstream_meta.outputs.sha }}"
          git push origin "${{ steps.check_branch.outputs.branch }}"

      # Step 7: Open a Pull Request for review
      - name: Create Pull Request
        if: >-
          steps.check_branch.outputs.exists == 'false' &&
          steps.copy_files.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: sync upstream postgres-operator-examples @ ${{ steps.upstream_meta.outputs.sha }}" \
            --body "## Upstream postgres-operator-examples Sync

          This PR was automatically generated by the **Sync Upstream postgres-operator-examples** workflow.

          **Upstream commit:** \`${{ steps.upstream_meta.outputs.sha }}\`
          **Source:** [CrunchyData/postgres-operator-examples](https://github.com/CrunchyData/postgres-operator-examples)

          ### Changed paths
          - \`helm/postgres/\`
          - \`LICENSE.md\`
          - \`README.md\`

          ### What to review
          - Compare changes against your custom configuration in \`helm/postgres/\`
          - Keep any intentional local overrides that diverge from upstream
          - Merge only what you want to adopt from this upstream snapshot

          > Triggered by: ${{ github.event_name }}" \
            --base main \
            --head "${{ steps.check_branch.outputs.branch }}"
